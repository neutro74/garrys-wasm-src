<!doctype html><meta charset="utf-8"><title>p2p test</title>
<script type="module">
import { P2P } from '../p2p.js';
import { RingWriter, RingReader } from '../../tools/lift/host/ring.mjs';
window.result = { pending: true };
try {
  const host = new P2P({ edition: 'extended' }), guest = new P2P({ edition: 'extended' }), other = new P2P({ edition: 'base' });
  const invite = await host.createInvite();
  let mismatch = '';
  try { await other.acceptInvite(invite.code); } catch (e) { mismatch = e.message; }
  const reply = await guest.acceptInvite(invite.code);
  await host.finishInvite(reply);
  for (let i = 0; i < 100 && !(host.peers.size && guest.peers.size); i++) await new Promise((r) => setTimeout(r, 100));
  // the guest's engine sends a datagram to the host (10.77.0.1:27015)
  const frame = (src, dst, payload) => { const f = new Uint8Array(13 + payload.length), dv = new DataView(f.buffer); f[0] = 1; dv.setUint32(1, src); dv.setUint16(5, 27005); dv.setUint32(7, dst); dv.setUint16(11, 27015); f.set(payload, 13); return f; };
  const hostIp = (10 << 24) | (77 << 16) | 1, guestIp = (10 << 24) | (77 << 16) | 2;
  new RingWriter(guest.fromGuest).write(frame(guestIp, hostIp, [1, 2, 3]));
  const toHost = new RingReader(host.toGuest);
  let got = null; for (let i = 0; i < 50 && !got; i++) { await new Promise((r) => setTimeout(r, 50)); for (let f; (f = toHost.read());) if (f[0] === 1) got = [...f.subarray(13)]; }
  // and the host answers the guest by its virtual address
  new RingWriter(host.fromGuest).write(frame(hostIp, guestIp, [9, 9]));
  const toGuest = new RingReader(guest.toGuest);
  let back = null; for (let i = 0; i < 50 && !back; i++) { await new Promise((r) => setTimeout(r, 50)); for (let f; (f = toGuest.read());) if (f[0] === 1) back = [...f.subarray(13)]; }
  window.result = { mismatch, hostStatus: host.status(), guestStatus: guest.status(), got, back, codeLen: invite.code.length };
} catch (e) { window.result = { error: e.message }; }
</script>
